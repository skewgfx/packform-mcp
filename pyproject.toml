[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packform-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Packform distributor API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
packform-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
